// polylabel (pole of inaccessibility) - ringkas, tanpa dependensi
function pointToSegDist(px,py,a,b){let x=a[0],y=a[1],dx=b[0]-x,dy=b[1]-y;if(dx||dy){const t=((px-x)*dx+(py-y)*dy)/(dx*dx+dy*dy);if(t>1){x=b[0];y=b[1]}else if(t>0){x+=dx*t;y+=dy*t}}dx=px-x;dy=py-y;return dx*dx+dy*dy}
function signedDist(px,py,rings){let inside=false,min=Infinity;for(const ring of rings){for(let i=0,n=ring.length,j=n-1;i<n;j=i++){const a=ring[i],b=ring[j];if((a[1]>py)!==(b[1]>py)&&px<(b[0]-a[0])*(py-a[1])/(b[1]-a[1])+a[0])inside=!inside;min=Math.min(min,pointToSegDist(px,py,a,b))}}return (inside?1:-1)*Math.sqrt(min)}
function polylabel(rings,prec){let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const p of rings[0]){minX=Math.min(minX,p[0]);minY=Math.min(minY,p[1]);maxX=Math.max(maxX,p[0]);maxY=Math.max(maxY,p[1])}
 const w=maxX-minX,h=maxY-minY,cs=Math.min(w,h);let hh=cs/2;if(cs===0)return{x:minX,y:minY,d:0};
 const mk=(x,y,h)=>{const d=signedDist(x,y,rings);return{x,y,h,d,max:d+h*Math.SQRT2}};
 const q=[];for(let x=minX;x<maxX;x+=cs)for(let y=minY;y<maxY;y+=cs)q.push(mk(x+hh,y+hh,hh));
 let best=mk(minX+w/2,minY+h/2,0);
 while(q.length){q.sort((a,b)=>a.max-b.max);const c=q.pop();if(c.d>best.d)best=c;if(c.max-best.d<=prec)continue;hh=c.h/2;q.push(mk(c.x-hh,c.y-hh,hh),mk(c.x+hh,c.y-hh,hh),mk(c.x-hh,c.y+hh,hh),mk(c.x+hh,c.y+hh,hh))}
 return best}
// lingkaran terbesar yang muat di fitur; koordinat lon dikali cos(lat) agar isotropik
function inscribed(feature,K){const polys=feature.geometry.type==='Polygon'?[feature.geometry.coordinates]:feature.geometry.coordinates;let best=null;
 for(const poly of polys){const rings=poly.map(r=>r.map(p=>[p[0]*K,p[1]]));const c=polylabel(rings,1e-5);if(!best||c.d>best.d)best={x:c.x/K,y:c.y,d:c.d}}return best}

<script>
(function(){
const a=document.getElementById('bgm'),b=document.getElementById('bgmBtn'),VOL=.55;let want=true,on=false,fd=0;a.volume=0;
const ui=()=>{b.setAttribute('aria-pressed',on);b.classList.toggle('off',!on);b.querySelector('.t').textContent=on?'Musik On':'Musik Off'};
const fade=(to,done)=>{clearInterval(fd);fd=setInterval(()=>{const d=to-a.volume;if(Math.abs(d)<.03){a.volume=to;clearInterval(fd);done&&done()}else a.volume=Math.max(0,Math.min(1,a.volume+Math.sign(d)*.03))},60)};
const unlock=['pointerdown','keydown','touchend','click'];
function arm(){unlock.forEach(e=>addEventListener(e,gate,true))}
function disarm(){unlock.forEach(e=>removeEventListener(e,gate,true))}
function gate(e){if(b.contains(e.target))return;start()}
function start(){if(!want||on)return;const p=a.play();if(p&&p.then)p.then(()=>{on=true;ui();disarm();fade(VOL)}).catch(()=>{})}
b.addEventListener('click',()=>{if(on){want=false;on=false;ui();fade(0,()=>a.pause())}else{want=true;const p=a.play();if(p&&p.then)p.then(()=>{on=true;ui();disarm();fade(VOL)}).catch(()=>{})}});
ui();arm();start();
})();
</script>
